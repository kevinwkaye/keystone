plugins {
    id 'com.android.application'
}

// The version comes from CMakeLists.txt, the one place every release sets it, so the phone
// and watch apps always match the release they ship in. 0.4.22 becomes versionCode 422.
def ksVersion = (file('../../CMakeLists.txt').text =~ /project\(Keystone VERSION ([0-9.]+)/)[0][1]
def ksCode = ksVersion.tokenize('.').inject(0) { a, b -> a * 100 + (b as int) }

android {
    namespace 'uk.kevinkaye.keystone'
    compileSdk 34

    defaultConfig {
        applicationId 'uk.kevinkaye.keystone'
        minSdk 26
        targetSdk 34
        versionCode ksCode
        versionName ksVersion
    }

    // One fixed key, kept in the repo, so each new APK installs over the last one.
    // It only signs this hobby app; it protects nothing else.
    signingConfigs {
        release {
            storeFile file('keystone.jks')
            storePassword 'keystone-flip-fella'
            keyAlias 'keystone'
            keyPassword 'keystone-flip-fella'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    buildFeatures {
        buildConfig true
    }

    packaging {
        resources { excludes += ['META-INF/versions/9/OSGI-INF/MANIFEST.MF', 'META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*'] }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Update watch: the watch's wireless debugging, as Bugjaeger uses it
    implementation 'com.github.MuntashirAkon:libadb-android:3.1.1'
    implementation 'com.github.MuntashirAkon:sun-security-android:1.1'
    implementation 'org.conscrypt:conscrypt-android:2.5.3'
    implementation 'androidx.annotation:annotation:1.9.1'
}
