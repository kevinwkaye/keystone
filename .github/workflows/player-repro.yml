name: Player repro (temporary)
on:
  push:
    branches: [player-repro]
permissions:
  contents: read
jobs:
  repro:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Kevin's Pi (0.5.5 image) and the 0.6.3 packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -x
          gh release download v0.5.5 -R "$GITHUB_REPOSITORY" -p "*pi.img.xz"
          gh release download v0.6.3 -R "$GITHUB_REPOSITORY" -p "*linux-arm64.tar.gz"
          xz -d -T0 Keystone-0.5.5-pi.img.xz
          LOOP=$(sudo losetup -fP --show Keystone-0.5.5-pi.img)
          sudo mkdir -p /mnt/pi && sudo mount ${LOOP}p2 /mnt/pi
          tar -xzf Keystone-0.6.3-linux-arm64.tar.gz
          ls keystone/pi/player | grep -c "%3a" || true
          sudo mkdir -p /mnt/pi/tmp/player && for f in keystone/pi/player/*.deb; do b=$(basename "$f"); sudo cp "$f" "/mnt/pi/tmp/player/${b//%3a/_}"; done
          sudo mount --bind /dev /mnt/pi/dev; sudo mount -t proc proc /mnt/pi/proc; sudo mount -t sysfs sys /mnt/pi/sys
          echo "== in our set"; ls keystone/pi/player | wc -l; ls keystone/pi/player | grep -E "placebo|sdl2|mysofa|libxi6|x11-common|libepoxy|libva-wayland|mujs" || echo none-of-those
          echo "== installed already"; sudo chroot /mnt/pi dpkg-query -W libc6 libgl1 libdrm2 libstdc++6 mesa-libgallium libgbm1 libegl1 2>&1 || true
          sudo mount --bind /dev/pts /mnt/pi/dev/pts
          echo "== dpkg -i"
          sudo chroot /mnt/pi bash -c 'DEBIAN_FRONTEND=noninteractive dpkg -i --skip-same-version /tmp/player/*.deb' > real.txt 2>&1 || echo "dpkg failed"
          grep -cE "^Setting up" real.txt || true
          grep -E "dpkg: error|dependency problems|^E:" real.txt | head -20 || true
          sudo chroot /mnt/pi mpv --version | head -2 || true
          sudo chroot /mnt/pi apt-get check && echo APT-CHECK-OK || true
