name: Build Keystone

on:
  push:
    # main builds and releases; next only builds and tests (work in progress)
    branches: [main, next]
    # Kuddle's plugin has its own build (kuddle.yml); its engine is part of Keystone now
    paths:
      - "**"
      - "!kuddle/**"
      - "kuddle/engine/**"
      - "!.github/workflows/kuddle.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  VERSION: "0.4.4"

jobs:
  # Make sure the release exists so every job can add its files to it.
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Create the release if it isn't there
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "v$VERSION" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "v$VERSION" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Keystone $VERSION" --notes "Building..." --prerelease

  windows:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Build the AVX2 version of the app
        run: |
          cmake -S . -B build-avx2 -A x64 -DKEYSTONE_AVX2=ON -DKEYSTONE_BUILD_TESTS=OFF "-DFETCHCONTENT_BASE_DIR=${{ github.workspace }}/build/_deps" -DFETCHCONTENT_FULLY_DISCONNECTED=ON
          cmake --build build-avx2 --config Release --parallel 4 --target Keystone

      - name: Engine tests and CPU benchmark
        shell: pwsh
        run: |
          $model = Get-ChildItem -Recurse build\_deps -Filter wavenet_a1_standard.nam | Select-Object -First 1
          build\Release\keystone_tests.exe $model.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item bench.md bench-windows.md

      - name: Link test (start Keystone, connect like the phone)
        run: python tools/linktest.py build\app\Keystone_artefacts\Release\Keystone.exe

      - name: Check the laptop scripts (Windows PowerShell 5.1, as on the laptop)
        shell: powershell
        run: |
          $bad = $false
          Get-ChildItem tools -Filter *.ps1 | ForEach-Object {
            $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errs)
            if ($errs) { $bad = $true; $errs | ForEach-Object { Write-Host "$($_.Extent.File):$($_.Extent.StartLineNumber) $($_.Message)" } }
          }
          if ($bad) { exit 1 }
          & ".\tools\Set up footswitch.ps1" -Check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=$env:VERSION "/DSourceDir=..\build\app\Keystone_artefacts\Release" "/DAvx2Dir=..\build-avx2\app\Keystone_artefacts\Release" installer\keystone.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist

      - name: Add to the release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release upload "v$env:VERSION" "dist\Keystone-$env:VERSION-Setup.exe" bench-windows.md --clobber -R $env:GITHUB_REPOSITORY

  linux-arm64:
    needs: prepare
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libfreetype-dev libfontconfig1-dev libx11-dev \
            libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev libgl-dev libcurl4-openssl-dev

      - name: Configure and build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Engine tests and CPU benchmark (ARM64)
        run: |
          model=$(find build/_deps -name wavenet_a1_standard.nam | head -1)
          ./build/keystone_tests "$model"
          cp bench.md bench-linux-arm64.md
          ./build/keystone_tests --defaults android/app/src/main/assets/defaults.js
          git diff --exit-code android/app/src/main/assets/defaults.js || { echo "::error::defaults.js is out of date: run keystone_tests --defaults"; exit 1; }

      # the Pi runs Keystone with no screen: check it starts that way (no display, no sound card)
      - name: Starts with no screen (like the Pi)
        continue-on-error: true
        run: |
          export HOME="$RUNNER_TEMP/kshome" && mkdir -p "$HOME/Documents"
          unset DISPLAY
          timeout 20 ./build/app/Keystone_artefacts/Release/Keystone --background > smoke.log 2>&1 || true
          cat smoke.log | tail -20
          cat "$HOME/Documents/Keystone/keystone.log" 2>/dev/null | tail -30 || true
          grep -q '"version"' "$HOME/Documents/Keystone/started.json" && echo "Started with no screen"

      # an hour of audio with a gig's worth of footwork, the audio on its own thread
      - name: Soak test (ARM64, like the Pi)
        run: ./build/keystone_tests --soak 60 | tee soak-linux-arm64.md

      - name: Package and add to the release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist/keystone
          cp build/app/Keystone_artefacts/Release/Keystone dist/keystone/keystone
          cp installer/README.txt dist/keystone/
          mkdir -p dist/keystone/pi && cp pi/* dist/keystone/pi/
          tar -C dist -czf "Keystone-$VERSION-linux-arm64.tar.gz" keystone
          gh release upload "v$VERSION" "Keystone-$VERSION-linux-arm64.tar.gz" bench-linux-arm64.md soak-linux-arm64.md --clobber -R "$GITHUB_REPOSITORY"

  android:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build the APK
        run: gradle -p android assembleRelease --no-daemon

      - name: Add to the release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "Keystone-$VERSION.apk"
          gh release upload "v$VERSION" "Keystone-$VERSION.apk" --clobber -R "$GITHUB_REPOSITORY"

  # Release notes, with the measured CPU from both machines.
  notes:
    needs: [windows, linux-arm64, android]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write the release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "v$VERSION" -p "bench-*.md" -R "$GITHUB_REPOSITORY" --clobber
          {
            cat docs/release-notes.md
            echo
            echo "## Measured on the Windows build machine (x64)"
            sed 1,2d bench-windows.md
            echo
            echo "## Measured on the Linux ARM64 build machine"
            sed 1,2d bench-linux-arm64.md
            echo
            echo "Built from ${GITHUB_SHA::7}."
          } > notes.md
          gh release edit "v$VERSION" --notes-file notes.md -R "$GITHUB_REPOSITORY"
